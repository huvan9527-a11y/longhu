name: 龙虎榜双模拟仓
on:
  schedule:
    - cron: '10 9,11,13 * * 1-5'
  workflow_dispatch:
  push:
    paths: ['*.py', 'tests/**', 'requirements.txt', 'config.json', '.github/workflows/paper.yml']
permissions:
  contents: write
concurrency:
  group: longhu-paper
  cancel-in-progress: false
jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify strategy
        run: python -m unittest discover -s tests -v
      - name: Screen today's fresh disclosures
        id: screening
        run: python preview.py
      - name: Persist screening result or waiting status
        if: always() && (steps.screening.outcome == 'success' || steps.screening.outcome == 'failure')
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for file in reports/current_signals.csv reports/screening_audit_latest.csv reports/screening_status.json reports/latest_signals.md; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Update post-close screening [skip ci]'
            git push origin HEAD:main
          fi
      - name: Update paper accounts
        run: python run.py
      - name: Persist immutable data and reports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data reports
          if ! git diff --cached --quiet; then
            git commit -m 'Update paper accounts [skip ci]'
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-ledgers-${{ github.run_id }}
          path: reports/

