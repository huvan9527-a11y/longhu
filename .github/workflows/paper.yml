name: 龙虎榜盘后预选
on:
  schedule:
    # 每天北京时间16:50首轮；17:40备用；19:10/21:10复核披露。
    # GitHub schedule可能延迟；串行运行避免模拟账本并发写入。
    - cron: '50 8 * * *'
    - cron: '10 11,13 * * 1-5'
    - cron: '40 9 * * 1-5'
  workflow_dispatch:
  push:
    paths: ['preview.py', 'rules.py', 'prices.py', 'tests/**', 'requirements.txt', 'config.json', '.github/workflows/paper.yml']
permissions:
  contents: write
concurrency:
  group: longhu-preview
  cancel-in-progress: false
jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify strategy
        run: python -m unittest discover -s tests -v
      - name: Screen today's fresh disclosures
        id: screening
        run: python preview.py
      - name: Persist screening result or waiting status
        if: always() && (steps.screening.outcome == 'success' || steps.screening.outcome == 'failure')
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for file in reports/current_signals.csv reports/screening_audit_latest.csv reports/screening_status.json reports/latest_signals.md reports/skipped_stocks.csv; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Update post-close screening [skip ci]'
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-ledgers-${{ github.run_id }}
          path: reports/


